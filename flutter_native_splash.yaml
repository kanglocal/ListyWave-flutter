# 스플래시 (PLAN §7 M6). 흰 배경 가운데 웹 PWA 아이콘 (assets/launcher/splash*.png).
# Android 12+ 는 아이콘을 원으로 자르므로 여백을 더 둔 이미지를 쓴다. dev/prod 공용이다.
# 다시 만들기: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/launcher/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/launcher/splash_android12.png
  android: true
  ios: true
  web: false

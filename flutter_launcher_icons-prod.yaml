# 앱 아이콘 (PLAN §7 M6). 원본은 웹 public/icons/pwa/ios/ios-pwa-1024.png 의 둥근 사각형 안쪽을 잘라
# 투명 모서리를 그라데이션으로 채운 assets/launcher/icon.png 다 (iOS 아이콘은 alpha 를 허용하지 않는다).
# 다시 만들기: dart run flutter_launcher_icons (dev/prod 를 함께 만든다)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/icon.png
  remove_alpha_ios: true

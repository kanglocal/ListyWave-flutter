name: listywave_app
description: "ListyWave mobile app (iOS/Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^17.5.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.5.1
  mime: ^2.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^3.0.0
  skeletonizer: ^3.0.0
  flutter_markdown_plus: ^1.0.12
  youtube_player_iframe: ^6.0.2
  html: ^0.15.7
  flutter_animate: ^4.5.2
  fl_chart: ^1.3.1
  share_plus: ^13.3.1
  gal: ^2.3.3
  kakao_flutter_sdk_share: ^2.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test/smoke_test.dart (PLAN M5). dev 백엔드가 필요해 CI 에서는 돌리지 않는다.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  riverpod_generator: ^3.0.3
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5
  # 2.6.0 은 objective_c(build hook) 를 끌고 온다. build_runner 2.15 의 AOT builder 컴파일이
  # build hook 이 있는 package graph 를 거부하므로 그 전 버전에 묶는다. 앱 코드는 쓰지 않는다
  # (path_provider 는 flutter_secure_storage/shared_preferences 의 windows/linux 구현과
  # cached_network_image 의 flutter_cache_manager 가 쓴다).
  path_provider_foundation: '>=2.4.1 <2.6.0'
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/new/
    - assets/icons/ver3/
    # web 의 <pattern>/<image> SVG 는 flutter_svg 가 그리지 못해 rsvg-convert 로 1x/2x/3x PNG 로 바꿨다.
    - assets/icons/png/
    - assets/images/
    # web intro Section3~7 그림 (mp4 영상은 GIF, filter 가 있는 SVG 는 rsvg-convert 로 1x/2x/3x PNG).
    - assets/images/intro/
    # Pretendard (SIL OFL 1.1) 원문. bootstrap 의 LicenseRegistry 가 읽어 라이선스 화면에 보인다.
    - assets/licenses/

  # web public/fonts 의 woff2 를 fonttools 로 변환한 파일이다 (PLAN §5.6).
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard/Pretendard-Bold.ttf
          weight: 700
